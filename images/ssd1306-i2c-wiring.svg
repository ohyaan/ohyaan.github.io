<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="title desc">
  <title id="title">Raspberry Pi to SSD1306 I2C signal map</title>
  <desc id="desc">With power disconnected, connect physical pin 1, 3.3 volts, to VCC; pin 6 ground to GND; pin 3 GPIO2 SDA1 to SDA; and pin 5 GPIO3 SCL1 to SCL. This is a signal map, not a physical pin layout. Check the module labels and the board's pin 1 marker.</desc>
  <rect x="1" y="1" width="478" height="358" rx="14" fill="#f5f7fa" stroke="#cbd5e1"/>
  <g font-family="sans-serif" fill="#152238">
    <text x="20" y="32" font-size="21" font-weight="700">Four wires, by label</text>
    <text x="20" y="57" font-size="16">Power disconnected · 3.3 V-compatible module</text>
    <rect x="16" y="78" width="245" height="221" rx="10" fill="#fff" stroke="#64748b"/>
    <rect x="344" y="78" width="120" height="221" rx="10" fill="#fff" stroke="#64748b"/>
    <text x="30" y="105" font-size="18" font-weight="700">Pi physical pins</text>
    <text x="360" y="105" font-size="18" font-weight="700">OLED</text>
    <g data-physical-pin="1" data-oled="VCC">
      <text x="30" y="148" font-size="20">1 · 3.3 V</text>
      <path d="M261 142H344" stroke="#b42332" stroke-width="4"/>
      <text x="360" y="148" font-size="20">VCC</text>
    </g>
    <g data-physical-pin="6" data-oled="GND">
      <text x="30" y="190" font-size="20">6 · Ground</text>
      <path d="M261 184H344" stroke="#334155" stroke-width="4"/>
      <text x="360" y="190" font-size="20">GND</text>
    </g>
    <g data-physical-pin="3" data-oled="SDA">
      <text x="30" y="232" font-size="20">3 · GPIO2 / SDA1</text>
      <path d="M261 226H344" stroke="#1767ad" stroke-width="4"/>
      <text x="360" y="232" font-size="20">SDA</text>
    </g>
    <g data-physical-pin="5" data-oled="SCL">
      <text x="30" y="274" font-size="20">5 · GPIO3 / SCL1</text>
      <path d="M261 268H344" stroke="#936000" stroke-width="4"/>
      <text x="360" y="274" font-size="20">SCL</text>
    </g>
    <text x="20" y="324" font-size="16" font-weight="700">Signal map — not a physical pin layout.</text>
    <text x="20" y="346" font-size="16">Locate Pi pin 1; follow your OLED's printed labels.</text>
  </g>
</svg>
